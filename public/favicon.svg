<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1B1630" />
      <stop offset="50%" stop-color="#0E101A" />
      <stop offset="100%" stop-color="#08090F" />
    </radialGradient>

    <!-- Monitor Frame Gradient -->
    <linearGradient id="monitorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="35%" stop-color="#A855F7" />
      <stop offset="70%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- D Letter Gradient -->
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="30%" stop-color="#EC4899" />
      <stop offset="70%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Screen Fill Gradient -->
    <linearGradient id="screenFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#260e3a" />
      <stop offset="50%" stop-color="#150d28" />
      <stop offset="100%" stop-color="#0a1226" />
    </linearGradient>
  </defs>

  <!-- Container Base Rounded Square (1:1 Ratio) -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGlow)" stroke="#23273D" stroke-width="4" />

  <!-- Ambient Light Swirl -->
  <ellipse cx="260" cy="250" rx="160" ry="140" fill="#9333EA" opacity="0.22" filter="blur(40px)" />
  <circle cx="160" cy="270" r="90" fill="#EC4899" opacity="0.25" filter="blur(35px)" />
  <circle cx="360" cy="230" r="80" fill="#06B6D4" opacity="0.2" filter="blur(35px)" />

  <!-- Monitor Screen Fill -->
  <rect x="180" y="160" width="180" height="140" rx="16" fill="url(#screenFill)" opacity="0.9" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Monitor Display Frame -->
  <g filter="url(#neonGlow)">
    <!-- Screen Outline -->
    <rect x="170" y="145" width="200" height="165" rx="20" fill="none" stroke="url(#monitorGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Monitor Stand Base -->
    <path d="M225 315 L205 345 L270 345 L335 345 L315 315" fill="none" stroke="#00F0FF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Stylized Neon Capital 'D' -->
  <g filter="url(#neonGlow)">
    <!-- Outer 'D' contour -->
    <path d="M125 150 L185 150 C235 150, 260 185, 260 230 C260 275, 235 310, 185 310 L125 310 Z" 
          fill="none" stroke="url(#dGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Inner 'D' counter-space -->
    <path d="M152 185 L180 185 C205 185, 222 205, 222 230 C222 255, 205 275, 180 275 L152 275 Z" 
          fill="none" stroke="url(#dGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  </g>

  <!-- 4K Digital Pixel Cubes (Top Right) -->
  <g filter="url(#neonGlow)">
    <rect x="335" y="115" width="18" height="18" rx="3" fill="#EC4899" />
    <rect x="360" y="105" width="16" height="16" rx="3" fill="#FACC15" />
    <rect x="360" y="130" width="20" height="20" rx="4" fill="#00F0FF" />
    <rect x="390" y="115" width="14" height="14" rx="2.5" fill="#A855F7" />
    <rect x="388" y="140" width="15" height="15" rx="3" fill="#39FF14" />
  </g>

  <!-- Floating Sparkles / Stars -->
  <circle cx="105" cy="180" r="3.5" fill="#00F0FF" opacity="0.9" />
  <circle cx="120" cy="340" r="3" fill="#EC4899" opacity="0.8" />
  <circle cx="395" cy="275" r="3.5" fill="#39FF14" opacity="0.8" />
  <circle cx="280" cy="100" r="4" fill="#FACC15" opacity="0.8" />
</svg>
